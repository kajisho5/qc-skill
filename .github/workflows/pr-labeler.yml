name: PR Labeler

# pull_request_target (not pull_request) so this also runs for PRs opened
# from forks - the GITHUB_TOKEN here needs write access to add labels,
# which pull_request events from forks don't get. Deliberately NO
# actions/checkout step: this workflow only calls the GitHub API (label
# creation + release-drafter's autolabeler), it never builds or executes
# any code from the PR head, so the privileged token is never exposed to
# fork-controlled code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'major', color: 'b60205', description: 'Breaking change - triggers a major version bump' },
              { name: 'breaking', color: 'b60205', description: 'Breaking change - triggers a major version bump' },
              { name: 'minor', color: '0e8a16', description: 'New backwards-compatible functionality' },
              { name: 'feature', color: '0e8a16', description: 'New backwards-compatible functionality' },
              { name: 'patch', color: 'fbca04', description: 'Backwards-compatible bug fix or small change' },
              { name: 'fix', color: 'fbca04', description: 'Backwards-compatible bug fix' },
              { name: 'documentation', color: '0075ca', description: 'Documentation only changes' },
              { name: 'chore', color: 'cfd3d7', description: 'Maintenance, no user-facing change' },
              { name: 'dependencies', color: '0366d6', description: 'Dependency version changes' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              } catch (error) {
                if (error.status !== 422) {
                  throw error;
                }
              }
            }

      - name: Autolabel PR from title/files
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
