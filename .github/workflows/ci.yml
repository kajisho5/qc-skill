name: tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11"]
    # ubuntu-latest is Ubuntu 26.04, which has no Python 3.9 build; keep 3.9 on the newest image that does
    runs-on: ${{ matrix.python-version == '3.9' && startsWith(matrix.os, 'ubuntu') && 'ubuntu-24.04' || matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pyflakes

      - name: Lint (pyflakes)
        run: python -m pyflakes src/qc_skill

      # ADR-021: the Homebrew and gyan.dev (Chocolatey) ffmpeg builds ship libvmaf, so the real
      # VMAF tests must run there (a missing libvmaf fails instead of skipping). Ubuntu's apt ffmpeg
      # is built without libvmaf: there the real "VMAF is UNKNOWN, SSIM/PSNR still run" path is tested.
      - name: Run tests
        env:
          QC_REQUIRE_LIBVMAF: ${{ runner.os != 'Linux' && '1' || '0' }}
        run: python -m pytest -q

      - name: doctor --json
        run: qc doctor --json

      - name: contract --json is valid JSON
        shell: bash
        run: qc contract --json | python -c "import json,sys; json.load(sys.stdin)"
